<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Order Food Online</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/zomato-logo.png" alt="Zomato Logo">
        </div>

        <ul>
            <li><a href="#">Investor Relations</a></li>
            <li><a href="#">Add Restaurant</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#">Sign Up</a></li>
        </ul>
    </header>

    <main>
        <img src="images/zomato-banner.jpg" alt="Zomato Banner">
        <p>Discover the best food and drinks in your city</p>

        <input type="text" placeholder="Search for restaurants, cuisines, or dishes">
        <button>Search</button>
    </main>

    <footer>
        <p>&copy; 2024 Zomato. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
